<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="panel" aria-labelledby="app-title">
        <header class="header">
          <div>
            <p class="eyebrow">Go HTTP API</p>
            <h1 id="app-title">Todo</h1>
          </div>
          <span id="serverStatus" class="status">확인 중</span>
        </header>

        <form id="todoForm" class="form">
          <label class="sr-only" for="todoTitle">할 일</label>
          <input id="todoTitle" name="title" type="text" autocomplete="off" placeholder="할 일을 입력하세요">
          <button type="submit">추가</button>
        </form>

        <div class="toolbar">
          <span id="summary">0개</span>
          <button id="refreshButton" type="button" class="ghost">새로고침</button>
        </div>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>
        <p id="emptyState" class="empty" hidden>등록된 할 일이 없습니다.</p>
        <p id="message" class="message" role="status"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
